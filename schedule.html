<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 일정</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="mobile-app">
    <header class="page-title-header">
        <a href="index.html" class="back-button">‹</a>
        <h1>내 일정</h1>
    </header>

    <main>
        <section class="calendar-box">
            <div class="calendar-title">2026년 8월</div>

            <div class="calendar-control">
                <button class="text-button">‹</button>
                <button class="text-button">›</button>
            </div>

            <div class="calendar-week">
                <span>일</span><span>월</span><span>화</span><span style="color:#84C814;">수</span><span>목</span><span>금</span><span>토</span>
            </div>

            <div class="calendar-days">
                <span>17</span><span>18</span><span>19</span><span class="calendar-today">20</span><span>21</span><span>22</span><span>23</span>
            </div>
        </section>

        <p class="schedule-date">8월 20일 일정</p>

        <article class="schedule-card">
            <span class="media-slot icon-slot"></span>
            <div>
                <strong>가족관계증명서 서명</strong>
                <p>가족 서명 요청 확인</p>
            </div>
        </article>

        <article class="schedule-card">
            <span class="media-slot icon-slot"></span>
            <div>
                <strong>주민등록등본 준비</strong>
                <p>본인 제출</p>
            </div>
        </article>

        <article class="schedule-card warning">
            <span class="media-slot icon-slot"></span>
            <div>
                <strong style="color:#F28A16;">접수 마감 D-2</strong>
                <p>서울 강서구 행복주택</p>
            </div>
        </article>
    </main>

    <div id="footer"></div>
</div>

    <script src="./js/app.js"></script>
    <script src="./js/header.js"></script>
    <script src="./js/footer.js"></script>

</body>
</html>
