<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산맵</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="mobile-app">
    <main class="map-content">
        <h1>부동산맵</h1>
        <span class="eyebrow">주변 정보</span>

        <div class="media-slot map-slot map-placeholder"></div>

        <div class="map-filter-row">
            <button type="button">내 조건만 보기</button>
            <button type="button">전체 보기</button>
        </div>

        <article class="map-card">
            <span class="media-slot icon-slot"></span>
            <div>
                <strong>수원시 청년 매입임대</strong>
                <p>현재 위치 2.1km</p>
            </div>
            <span class="arrow">›</span>
        </article>

        <article class="map-card">
            <span class="media-slot icon-slot"></span>
            <div>
                <strong>성남시 매입임대 신규</strong>
                <p>현재 위치 5.4km</p>
            </div>
            <span class="arrow">›</span>
        </article>
    </main>

    <div id="footer"></div>
</div>

    <script src="./js/app.js"></script>
    <script src="./js/header.js"></script>
    <script src="./js/footer.js"></script>

</body>
</html>
